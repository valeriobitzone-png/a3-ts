name: CI

on:
  push:
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Run tests
        run: pnpm test
        env:
          CI: true

  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the public boundary guard from a3 main
        run: git clone --depth 1 https://github.com/valeriobitzone-png/a3.git "$RUNNER_TEMP/a3-guard"
      - name: Public boundary guard (tree and full history)
        run: |
          python3 "$RUNNER_TEMP/a3-guard/tools/public_boundary.py" --root .
          python3 "$RUNNER_TEMP/a3-guard/tools/public_boundary.py" --root . --history
